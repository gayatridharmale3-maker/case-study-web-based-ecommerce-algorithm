<!DOCTYPE html>
<html>
<head>
    <title>Amazon Clone</title>

    <style>
        * {
            margin: 0;
            font-family: Arial;
        }

        body {
            background-color: #e2e7e6;
        }

        /* NAVBAR */
        .navbar {
            height: 60px;
            background-color: #131921;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .logo {
            background-image: url("amazon_logo.png");
            background-size: cover;
            height: 40px;
            width: 100px;
        }

        .search-box {
            display: flex;
            width: 50%;
        }

        .search-box input {
            width: 100%;
            padding: 10px;
            border: none;
        }

        .search-btn {
            background-color: #febd69;
            padding: 10px;
            cursor: pointer;
        }

        .cart {
            font-weight: bold;
        }

        /* HERO */
        .hero {
            background-image: url("hero_image.jpg");
            height: 300px;
            background-size: cover;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .hero-text {
            background: white;
            padding: 10px;
            margin-bottom: 20px;
        }

        /* HEADING */
        .heading {
            text-align: center;
            font-size: 28px;
            margin: 20px;
            color: #131921;
        }

        /* PRODUCTS */
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
        }

        .product {
            background: white;
            padding: 15px;
            margin: 10px;
            width: 220px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        .product img {
            width: 200px;
            height: 150px;
            object-fit: cover;
        }

        button {
            background-color: #ff9900;
            border: none;
            padding: 8px;
            margin-top: 5px;
            cursor: pointer;
        }

        /* CART */
        .cart-box {
            background: white;
            margin: 20px;
            padding: 20px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo"></div>

    <div class="search-box">
        <input type="text" id="search" placeholder="Search Amazon..." onkeyup="searchProduct()">
        <div class="search-btn">🔍</div>
    </div>

    <div class="cart">Cart 🛒</div>
</div>

<!-- HERO -->
<div class="hero">
    <div class="hero-text">
        Welcome to Amazon Clone - Shop Smart 🛍️
    </div>
</div>

<h2 class="heading">🔥 Trending Products</h2>

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<!-- CART -->
<div class="cart-box">
    <h2>Your Cart</h2>
    <div id="cart"></div>
    <h3 id="total"></h3>
</div>

<script>
    let products = [
        {name: "Clothes", price: 2000, image: "box1_image.jpg"},
        {name: "Health & Care", price: 1500, image: "box2_image.jpg"},
        {name: "Furniture", price: 8000, image: "box3_image.jpg"},
        {name: "Electronics", price: 12000, image: "box4_image.jpg"},
        {name: "Beauty", price: 1000, image: "box5_image.jpg"},
        {name: "Pet Care", price: 700, image: "box6_image.jpg"}
    ];

    let cart = [];

    // Display Products (Traversal Algorithm)
    function displayProducts(list) {
        let output = "";
        list.forEach((item, index) => {
            output += `
            <div class="product">
                <img src="${item.image}">
                <h3>${item.name}</h3>
                <p>₹${item.price}</p>
                <button onclick="addToCart(${index})">Add to Cart</button>
            </div>`;
        });
        document.getElementById("products").innerHTML = output;
    }

    // Search Algorithm (Linear Search)
    function searchProduct() {
        let input = document.getElementById("search").value.toLowerCase();

        let filtered = products.filter(product =>
            product.name.toLowerCase().includes(input)
        );

        displayProducts(filtered);
    }

    // Add to Cart
    function addToCart(index) {
        cart.push(products[index]);
        updateCart();
    }

    // Remove from Cart
    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCart();
    }

    // Update Cart + Total (Summation Algorithm)
    function updateCart() {
        let output = "";
        let total = 0;

        cart.forEach((item, index) => {
            output += `
            <p>
                ${item.name} - ₹${item.price}
                <button onclick="removeFromCart(${index})">Remove</button>
            </p>`;
            total += item.price;
        });

        document.getElementById("cart").innerHTML = output;
        document.getElementById("total").innerText = "Total: ₹" + total;
    }

    displayProducts(products);
</script>

</body>
</html>
